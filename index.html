<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عید مبارک | High Vision Mobile</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Reem+Kufi+Calligraphy:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-gradient: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --emerald: #021a11;
            --accent-green: #053b27;
            --text-white: #f0fdf4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--emerald);
            background-image: radial-gradient(circle at center, var(--accent-green) 0%, var(--emerald) 100%);
            color: var(--text-white);
            min-height: 100vh;
            font-family: 'Amiri', serif;
            overflow-x: hidden; /* فون پر اسکرین دائیں بائیں نہیں ہلے گی */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        /* --- Decorations --- */
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite; }
        
        .moon {
            position: fixed; top: 20px; left: 20px; font-size: 3rem;
            filter: drop-shadow(0 0 20px #fcf6ba);
            animation: float 5s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* --- Header --- */
        header { text-align: center; margin-top: 15vh; z-index: 5; width: 100%; }

        h1 {
            font-family: 'Reem Kufi Calligraphy', sans-serif;
            font-size: clamp(3.5rem, 15vw, 8rem); /* فون پر چھوٹا، کمپیوٹر پر بڑا */
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .urdu-subtitle {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: clamp(1.2rem, 5vw, 2rem);
            margin-bottom: 30px;
            color: #d1fae5;
            padding: 0 15px;
        }

        /* --- Buttons --- */
        .controls {
            display: flex;
            flex-direction: column; /* فون پر بٹن ایک دوسرے کے نیچے آئیں گے */
            gap: 15px;
            margin-bottom: 30px;
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }

        .btn {
            padding: 15px;
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 1.4rem;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
            width: 100%;
        }

        .btn-gold { background: var(--gold-gradient); color: var(--emerald); font-weight: bold; }
        .btn-outline { background: transparent; border: 2px solid #bf953f; color: #fcf6ba; }

        .btn:active { transform: scale(0.95); } /* کلک کرنے پر دبنے کا احساس */

        /* --- Blessing Card --- */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 30px 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            z-index: 5;
        }

        #dua-text {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 1.3rem;
            line-height: 2;
            min-height: 80px;
        }

        /* --- Mobile-Friendly Burst --- */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            font-family: 'Amiri', serif;
            font-weight: bold;
            color: #fcf6ba;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
            animation: moveParticle 2s forwards ease-out;
        }

        @keyframes moveParticle {
            0% { transform: translate(0, 0); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)); opacity: 0; }
        }

        footer { margin-top: auto; padding: 20px; opacity: 0.3; font-size: 0.9rem; }

        /* کمپیوٹر کے لیے ایڈجسٹمنٹ */
        @media (min-width: 600px) {
            .controls { flex-direction: row; max-width: 600px; }
            .moon { font-size: 5rem; top: 40px; left: 40px; }
            #dua-text { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div class="stars" id="star-container"></div>
    <div class="moon">🌙</div>

    <header>
        <h1>عید مبارک</h1>
        <p class="urdu-subtitle">آپ کے لیے خاص عید کا تحفہ</p>
    </header>

    <div class="controls">
        <button class="btn btn-gold" onclick="celebrate()">خوشیاں منائیں ✨</button>
        <button class="btn btn-outline" onclick="newDua()">دعا حاصل کریں 🤲</button>
    </div>

    <div class="card">
        <p id="dua-text">اللہ تعالیٰ آپ کو اور آپ کے گھر والوں کو عید کی حقیقی خوشیاں نصیب فرمائے۔</p>
    </div>

    <footer>
        <p>© ٢٠٢٦ | HIGH VISION</p>
    </footer>

    <script>
        // Stars Logic
        const starContainer = document.getElementById('star-container');
        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = star.style.height = Math.random() * 2 + 'px';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            starContainer.appendChild(star);
        }

        const duas = [
            "اللہ آپ کی زندگی میں برکتیں اور خوشیاں لائے۔",
            "اللہ آپ کی ہر دعا کو قبول فرمائے۔ عید مبارک!",
            "اللہ آپ کو ہمیشہ ہنستا مسکراتا رکھے۔",
            "دعا ہے کہ یہ عید امن اور سکون کا پیغام لائے۔",
            "اللہ آپ کے رزق اور کاروبار میں برکت عطا فرمائے۔"
        ];

        function newDua() {
            const text = document.getElementById('dua-text');
            text.style.opacity = 0;
            setTimeout(() => {
                text.innerText = duas[Math.floor(Math.random() * duas.length)];
                text.style.opacity = 1;
            }, 300);
        }

        function celebrate() {
            // موبائل کے لیے ہم فاصلہ (distance) کم رکھیں گے تاکہ اسکرین سے باہر نہ جائے
            const isMobile = window.innerWidth < 600;
            const burstCount = isMobile ? 10 : 18;
            const spread = isMobile ? 150 : 350;

            for (let i = 0; i < burstCount; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.innerText = 'عید مبارک';
                
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * spread;
                const mx = Math.cos(angle) * dist + 'px';
                const my = Math.sin(angle) * dist + 'px';
                
                p.style.setProperty('--mx', mx);
                p.style.setProperty('--my', my);
                
                p.style.left = '50%';
                p.style.top = '40%';

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 2000);
            }
        }
    </script>
</body>
</html>
