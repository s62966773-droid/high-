<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد مبارك</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gold: #e6c27a;
            --deep-green: #063b27;
            --light-green: #0f5c3d;
            --glass: rgba(255, 255, 255, 0.08);
            --text-light: #f0fdf4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--deep-green);
            color: var(--text-light);
            overflow-x: hidden;
            background: linear-gradient(135deg, var(--light-green) 0%, var(--deep-green) 100%);
            min-height: 100vh;
            font-family: 'Aref Ruqaa', serif; /* Applied Calligraphy Font Everywhere */
        }

        /* --- Virtual Animations --- */
        .background-animations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .moon {
            position: absolute;
            top: 15%;
            left: 20%; /* Switched side for RTL */
            font-size: 8rem;
            filter: drop-shadow(0 0 40px rgba(230, 194, 122, 0.6));
            animation: float 6s ease-in-out infinite;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: twinkle linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.2; transform: scale(0.8); }
        }

        /* --- Main Content Styling --- */
        header {
            height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 1;
        }

        h1 {
            font-size: 7rem;
            color: var(--primary-gold);
            text-shadow: 0 0 30px rgba(230, 194, 122, 0.5);
            margin-bottom: 10px;
            animation: fadeIn 2s ease-out;
            font-weight: 700;
        }

        p.subtitle {
            font-size: 2rem;
            color: #d1fae5;
            animation: fadeIn 3s ease-out;
        }

        /* Audio Section */
        .container {
            max-width: 900px;
            margin: -20px auto 100px;
            padding: 20px;
            z-index: 1;
            position: relative;
        }

        .audio-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 20px rgba(230, 194, 122, 0.1);
        }

        .track-list {
            margin-top: 20px;
        }

        .track {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            border-radius: 10px;
        }

        .track:hover {
            background: rgba(230, 194, 122, 0.15);
            transform: scale(1.02) translateX(-10px); /* RTL slide direction */
            border-right: 4px solid var(--primary-gold);
        }

        .track-info h3 {
            color: var(--primary-gold);
            font-size: 2rem;
        }

        audio {
            /* Styled to match the green/gold theme slightly better */
            filter: sepia(20%) saturate(150%) hue-rotate(90deg);
            height: 35px;
            opacity: 0.9;
            outline: none;
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 1.5rem;
            color: #a7f3d0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 5rem; }
            .moon { font-size: 5rem; left: 10%; }
            .track { flex-direction: column; text-align: center; gap: 15px; }
            .track:hover { transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="background-animations">
        <div class="moon">🌙</div>
        <div class="star" style="top: 20%; right: 10%; width: 4px; height: 4px; animation-duration: 2s;"></div>
        <div class="star" style="top: 35%; right: 80%; width: 3px; height: 3px; animation-duration: 3s;"></div>
        <div class="star" style="top: 50%; right: 25%; width: 5px; height: 5px; animation-duration: 2.5s;"></div>
        <div class="star" style="top: 70%; right: 70%; width: 4px; height: 4px; animation-duration: 4s;"></div>
        <div class="star" style="top: 15%; right: 50%; width: 6px; height: 6px; animation-duration: 3.5s;"></div>
        <div class="star" style="top: 80%; right: 15%; width: 3px; height: 3px; animation-duration: 2.8s;"></div>
    </div>

    <header>
        <h1>عيد مبارك</h1> <p class="subtitle">فرح وبركات</p> </header>

    <div class="container">
        <div class="audio-card">
            <h2 style="margin-bottom: 25px; border-right: 4px solid var(--primary-gold); padding-right: 15px; font-size: 2.5rem;">صوتيات العيد</h2> <div class="track-list">
                <div class="track">
                    <div class="track-info">
                        <h3>أغنية عيد مبارك</h3> </div>
                    <audio controls autoplay loop>
                        <source src="eid-song.mp3" type="audio/mpeg">
                        متصفحك لا يدعم عنصر الصوت.
                    </audio>
                </div>

                <div class="track">
                    <div class="track-info">
                        <h3>لحن الغيتار</h3> </div>
                    <audio controls>
                        <source src="guitar-track.mp3" type="audio/mpeg">
                        متصفحك لا يدعم عنصر الصوت.
                    </audio>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>تم التصميم بامتياز &copy; ٢٠٢٦</p> </footer>

</body>
</html>
