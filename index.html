<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عید مبارک | جادوئی تحفہ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Reem+Kufi+Calligraphy:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-gradient: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --deep-emerald: #021a11;
            --emerald-silk: #032b1d;
            --white: #f0fdf4;
            --glow: 0 0 25px rgba(212, 175, 55, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, var(--emerald-silk) 0%, var(--deep-emerald) 100%);
            color: var(--white);
            min-height: 100vh;
            font-family: 'Amiri', serif;
            overflow: hidden; /* جب تک ڈبہ نہ کھلے، کچھ نظر نہ آئے */
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* --- Welcome / Unboxing Screen (The Magic Happens Here) --- */
        #unboxing-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--deep-emerald);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        .gift-box {
            font-size: 10rem;
            filter: drop-shadow(var(--glow));
            cursor: pointer;
            animation: bounce 2s infinite ease-in-out;
            transition: transform 0.8s;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        .click-text {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 2rem;
            color: #d1fae5;
            margin-top: 20px;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* --- Pure Magical Background --- */
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; opacity: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite; }
        
        .moon {
            position: fixed; top: 40px; left: 60px; font-size: 6rem;
            filter: drop-shadow(0 0 30px rgba(197, 160, 89, 0.6));
            opacity: 0; z-index: 2;
        }

        /* --- Elegant Header --- */
        header { text-align: center; margin-top: -10vh; z-index: 5; opacity: 0; }

        h1 {
            font-family: 'Reem Kufi Calligraphy', sans-serif;
            font-size: clamp(4rem, 15vw, 9rem);
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .urdu-subtitle {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            color: #ffffff;
            line-height: 2.2;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            padding: 0 10px;
        }

        /* --- Blessing Card --- */
        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            padding: 50px 30px;
            width: 90%;
            max-width: 800px;
            text-align: center;
            opacity: 0;
            z-index: 5;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.4);
        }

        .dua-display { min-height: 180px; display: flex; flex-direction: column; justify-content: center; }
        #dua-title { color: var(--gold-gradient); -webkit-text-fill-color: initial; font-size: 2.5rem; margin-bottom: 15px; }
        #dua-text { font-family: 'Noto Nastaliq Urdu', serif; font-size: 1.6rem; color: #d1fae5; line-height: 2.2; }

        /* --- Burst Effect --- */
        .particle {
            position: fixed; pointer-events: none; z-index: 100;
            font-family: 'Amiri', serif; font-weight: bold;
            color: #fcf6ba; font-size: clamp(1.2rem, 4vw, 2.5rem);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
            animation: burstParticle 2.5s forwards ease-out;
        }

        @keyframes burstParticle {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) rotate(var(--mr)); opacity: 0; scale: 1.5; }
        }

        /* --- Animation Triggers --- */
        .show { animation: fadeIn 2s forwards; opacity: 1; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 768px) {
            h1 { font-size: 5rem; }
            .card { padding: 30px; }
            .moon { font-size: 3.5rem; top: 20px; left: 20px; }
        }
    </style>
</head>
<body>

    <div id="unboxing-screen" onclick="openGift()">
        <div class="gift-box" id="gift">🎁</div>
        <p class="click-text">عید کا تحفہ کھولنے کے لیے کلک کریں</p>
    </div>

    <div class="stars" id="star-container"></div>
    <div class="moon" id="moon">🌙</div>
    
    <header id="header">
        <h1>عید مبارک</h1>
        <p class="urdu-subtitle">آپ کے لیے خاص عید کی دعا</p>
    </header>

    <div class="card" id="card">
        <div class="dua-display">
            <h3 id="dua-title">برکات و رحمت</h3>
            <p id="dua-text">اللہ تعالیٰ اس عید پر آپ کے گھر کو خوشیوں، امن اور سکون سے بھر دے۔</p>
        </div>
    </div>

    <script>
        // Stars background logic
        const starContainer = document.getElementById('star-container');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = star.style.height = Math.random() * 3 + 'px';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            starContainer.appendChild(star);
        }

        // Duas for the card
        const duas = [
            { title: "برکات و رحمت", text: "اللہ تعالیٰ اس عید پر آپ کے گھر کو خوشیوں، امن اور سکون سے بھر دے۔" },
            { title: "قبولیتِ دعا", text: "اللہ آپ کی تمام دعائیں، نیک اعمال اور قربانیاں اپنی بارگاہ میں قبول فرمائے۔" },
            { title: "خوشحالی", text: "یہ عید آپ کی زندگی میں کامیابیوں اور برکتوں کا نیا آغاز ثابت ہو۔" },
            { title: "صحت اور سلامتی", text: "اللہ آپ کو اور آپ کے اہل خانہ کو ہمیشہ اپنی حفظ و امان میں رکھے۔" },
            { title: "رزق میں برکت", text: "اللہ آپ کے رزق میں وسعت اور کاروبار میں برکت عطا فرمائے۔" }
        ];

        let index = 0;

        // Function to open the gift and start magic
        function openGift() {
            const screen = document.getElementById('unboxing-screen');
            const gift = document.getElementById('gift');
            
            // Animation for gift opening
            gift.style.transform = 'scale(5) rotate(360deg)';
            screen.style.opacity = '0';
            
            // Activate the rest of the site after animation
            setTimeout(() => {
                screen.style.display = 'none';
                document.body.style.overflow = 'auto'; // Re-enable scroll
                startMagic(); // Start the background & header
                setInterval(showBurst, 3000); // Continuous sparkle bursts
                setInterval(nextDua, 6000); // Cycle through duas automatically
            }, 800);
        }

        function startMagic() {
            document.getElementById('star-container').classList.add('show');
            document.getElementById('moon').classList.add('show');
            document.getElementById('header').classList.add('show');
            document.getElementById('card').classList.add('show');
            showBurst(); // First burst instantly
        }

        function nextDua() {
            const titleEl = document.getElementById('dua-title');
            const textEl = document.getElementById('dua-text');
            textEl.parentElement.style.opacity = 0;
            setTimeout(() => {
                index = (index + 1) % duas.length;
                titleEl.innerText = duas[index].title;
                textEl.innerText = duas[index].text;
                textEl.parentElement.style.opacity = 1;
            }, 500);
        }

        function showBurst() {
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.innerText = 'عید مبارک';
                
                const angle = Math.random() * Math.PI * 2;
                const dist = 300 + Math.random() * 500;
                const mx = Math.cos(angle) * dist + 'px';
                const my = Math.sin(angle) * dist + 'px';
                const mr = (Math.random() - 0.5) * 60 + 'deg';
                
                p.style.setProperty('--mx', mx);
                p.style.setProperty('--my', my);
                p.style.setProperty('--mr', mr);
                
                // Burst center position
                p.style.left = '50%';
                p.style.top = Math.random() * 50 + '%'; // Pops from different heights

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 2500);
            }
        }
    </script>
</body>
</html>
