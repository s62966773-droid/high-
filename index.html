<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عید مبارک | Radiant Blessings</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-gradient: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --deep-emerald: #021a11;
            --accent-green: #053b27;
            --glow: 0 0 25px rgba(197, 160, 89, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--deep-emerald);
            background-image: radial-gradient(circle at center, var(--accent-green) 0%, var(--deep-emerald) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Amiri', serif;
            overflow: hidden;
        }

        /* --- Elegant Frame --- */
        .page-frame {
            position: fixed;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 2px solid transparent;
            border-image: var(--gold-gradient) 1;
            z-index: 10;
            pointer-events: none;
            opacity: 0.5;
        }

        /* --- Floating Lanterns --- */
        .hanging-lantern {
            position: absolute;
            top: -20px;
            font-size: 3.5rem;
            filter: drop-shadow(0 0 15px #ffcc00);
            animation: swing 4s ease-in-out infinite;
            transform-origin: top center;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        /* --- Main Greeting Card --- */
        .card {
            text-align: center;
            padding: 60px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            border-radius: 4px;
            max-width: 900px;
            width: 90%;
            z-index: 5;
            animation: fadeInUp 2s ease;
        }

        .arabic-title {
            font-size: 9rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            font-weight: 700;
            display: block;
        }

        .urdu-subtitle {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 2.5rem;
            color: #fdfdfd;
            line-height: 2.2;
            margin-top: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* --- Radiant Light Sweep Animation --- */
        .shine {
            position: relative;
            overflow: hidden;
        }
        .shine::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: lightSweep 6s infinite;
        }

        @keyframes lightSweep {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Twinkling Stars */
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .arabic-title { font-size: 5rem; }
            .urdu-subtitle { font-size: 1.8rem; }
            .card { padding: 30px; }
        }
    </style>
</head>
<body>

    <div class="page-frame"></div>

    <div class="hanging-lantern" style="right: 15%;">🏮</div>
    <div class="hanging-lantern" style="left: 15%; animation-delay: 1s;">🏮</div>

    <script>
        for (let i = 0; i < 40; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.width = star.style.height = Math.random() * 3 + 'px';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(star);
        }
    </script>

    <div class="card shine">
        <span class="arabic-title">عید مبارک</span>
        <div class="urdu-subtitle">
            اللہ تعالیٰ آپ کی زندگی کو خوشیوں، برکتوں اور دائمی سکون سے بھر دے۔ <br>
            عید سعید مبارک!
        </div>
        
        <div style="margin-top: 40px; border-top: 1px solid rgba(197, 160, 89, 0.2); padding-top: 20px;">
            <p style="color: var(--gold-gradient); font-size: 1.2rem; letter-spacing: 5px; opacity: 0.8;">
                ١٤٤٧ ھ | ٢٠٢٦ م
            </p>
        </div>
    </div>

</body>
</html>
