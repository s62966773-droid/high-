<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد مبارك | High Vision</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi+Calligraphy:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --emerald: #062b1d;
            --soft-green: #0a4d33;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, var(--soft-green), var(--emerald));
            color: white;
            min-height: 100vh;
            font-family: 'Amiri', serif;
            overflow-x: hidden;
        }

        /* --- Welcome Overlay (Ensures Autoplay Works) --- */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--emerald);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: 0.8s ease;
        }

        .start-btn {
            padding: 20px 50px;
            font-size: 2.5rem;
            font-family: 'Reem Kufi Calligraphy', sans-serif;
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            transition: 0.4s;
        }

        .start-btn:hover {
            background: var(--gold);
            color: var(--emerald);
            box-shadow: 0 0 40px var(--gold);
            transform: scale(1.1);
        }

        /* --- Animations --- */
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; animation: blink 3s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .moon {
            position: absolute; top: 10%; left: 15%;
            font-size: 6rem; filter: drop-shadow(0 0 30px var(--gold));
            animation: float 5s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* --- Content Styling --- */
        .content {
            display: none; /* Hidden until button click */
            text-align: center;
            padding-top: 10vh;
            animation: fadeIn 2s forwards;
        }

        h1 {
            font-family: 'Reem Kufi Calligraphy', sans-serif;
            font-size: 7rem;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            margin-bottom: 20px;
        }

        .audio-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            width: 80%;
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        audio { width: 100%; filter: sepia(100%) saturate(200%) hue-rotate(40deg); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="font-family: 'Reem Kufi Calligraphy', sans-serif; margin-bottom: 30px; font-size: 2rem;">مرحباً بكم</h2>
        <button class="start-btn" onclick="startExperience()">ادخل هنا</button>
    </div>

    <div id="main-site" class="content">
        <div class="stars">
            <div class="moon">🌙</div>
            <div class="star" style="top:20%; right:10%; width:3px; height:3px;"></div>
            <div class="star" style="top:40%; right:70%; width:2px; height:2px; animation-delay: 1s;"></div>
            <div class="star" style="top:70%; right:30%; width:4px; height:4px; animation-delay: 2s;"></div>
        </div>

        <header>
            <h1>عيد مبارك</h1>
            <h2 style="font-family: 'Reem Kufi Calligraphy', sans-serif; color: #a7f3d0;">كل عام وأنتم بخير</h2>
        </header>

        <div class="audio-box">
            <h3 style="font-family: 'Reem Kufi Calligraphy', sans-serif; color: var(--gold); margin-bottom: 15px; font-size: 2rem;">ألحان العيد</h3>
            <audio id="eidMusic" controls loop>
                <source src="eid-song.mp3" type="audio/mpeg">
                <source src="guitar-track.mp3" type="audio/mpeg">
            </audio>
        </div>

        <footer style="margin-top: 50px; opacity: 0.6;">
            <p>© ٢٠٢٦ - تصميم احترافي</p>
        </footer>
    </div>

    <script>
        function startExperience() {
            const music = document.getElementById('eidMusic');
            const overlay = document.getElementById('overlay');
            const mainSite = document.getElementById('main-site');

            // Play music
            music.play().catch(error => console.log("Playback failed:", error));

            // Visual transition
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                mainSite.style.display = 'block';
            }, 800);
        }
    </script>
</body>
</html>
