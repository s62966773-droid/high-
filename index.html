<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gold: #d4af37;
            --deep-bg: #0a0e14;
            --glass: rgba(255, 255, 255, 0.05);
            --accent: #e5c76b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--deep-bg);
            color: white;
            overflow-x: hidden;
            background: linear-gradient(135deg, #1a1f2c 0%, #0a0e14 100%);
            min-height: 100vh;
        }

        /* --- Calligraphy Styling --- */
        .calligraphy-text {
            font-family: 'Aref Ruqaa', serif;
        }

        /* --- Virtual Animations --- */
        .background-animations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .moon {
            position: absolute;
            top: 15%;
            right: 20%;
            font-size: 8rem;
            filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.6));
            animation: float 6s ease-in-out infinite;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: twinkle linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.2; transform: scale(0.8); }
        }

        /* --- Main Content Styling --- */
        header {
            height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 1;
        }

        h1 {
            font-size: 6rem;
            color: var(--primary-gold);
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
            margin-bottom: 10px;
            animation: fadeIn 2s ease-out;
            font-weight: 700;
        }

        p.subtitle {
            font-size: 1.5rem;
            color: #aaa;
            animation: fadeIn 3s ease-out;
        }

        /* Audio Section */
        .container {
            max-width: 900px;
            margin: -20px auto 100px;
            padding: 20px;
            z-index: 1;
            position: relative;
        }

        .audio-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 20px rgba(212, 175, 55, 0.05);
        }

        .track-list {
            margin-top: 20px;
        }

        .track {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
            border-radius: 10px;
        }

        .track:hover {
            background: rgba(212, 175, 55, 0.15);
            transform: scale(1.02) translateX(10px);
            border-left: 4px solid var(--primary-gold);
        }

        .track-info h3 {
            color: var(--accent);
            font-size: 1.8rem;
        }

        audio {
            filter: invert(100%) sepia(20%) saturate(1000%) hue-rotate(10deg);
            height: 35px;
            opacity: 0.9;
            outline: none;
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #555;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 4rem; }
            .moon { font-size: 5rem; right: 10%; }
            .track { flex-direction: column; text-align: center; gap: 15px; }
            .track:hover { transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="background-animations">
        <div class="moon">🌙</div>
        <div class="star" style="top: 20%; left: 10%; width: 4px; height: 4px; animation-duration: 2s;"></div>
        <div class="star" style="top: 35%; left: 80%; width: 3px; height: 3px; animation-duration: 3s;"></div>
        <div class="star" style="top: 50%; left: 25%; width: 5px; height: 5px; animation-duration: 2.5s;"></div>
        <div class="star" style="top: 70%; left: 70%; width: 4px; height: 4px; animation-duration: 4s;"></div>
        <div class="star" style="top: 15%; left: 50%; width: 6px; height: 6px; animation-duration: 3.5s;"></div>
        <div class="star" style="top: 80%; left: 15%; width: 3px; height: 3px; animation-duration: 2.8s;"></div>
    </div>

    <header>
        <h1 class="calligraphy-text">Eid Mubarak</h1>
        <p class="subtitle calligraphy-text">Joy & Blessings</p>
    </header>

    <div class="container">
        <div class="audio-card">
            <h2 class="calligraphy-text" style="margin-bottom: 25px; border-left: 4px solid var(--primary-gold); padding-left: 15px; font-size: 2rem;">Celebration Audio</h2>
            
            <div class="track-list">
                <div class="track">
                    <div class="track-info">
                        <h3 class="calligraphy-text">Eid Mubarak Song</h3>
                    </div>
                    <audio controls>
                        <source src="eid-song.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </div>

                <div class="track">
                    <div class="track-info">
                        <h3 class="calligraphy-text">Guitar Melody</h3>
                    </div>
                    <audio controls>
                        <source src="guitar-track.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p class="calligraphy-text">&copy; 2026 Crafted with Excellence</p>
    </footer>

</body>
</html>
