<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عید مبارک | Majestic Celebration</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Reem+Kufi+Calligraphy:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-gradient: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --deep-emerald: #021a11;
            --accent-green: #053b27;
            --white: #f0fdf4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--deep-emerald);
            background-image: radial-gradient(circle at center, var(--accent-green) 0%, var(--deep-emerald) 100%);
            color: var(--white);
            min-height: 100vh;
            font-family: 'Amiri', serif;
            overflow: hidden; /* Keeps the bursts inside the screen */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Background Effects --- */
        .moon {
            position: fixed;
            top: 40px;
            left: 50px;
            font-size: 5rem;
            filter: drop-shadow(0 0 30px #fcf6ba);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- Main Content --- */
        header {
            text-align: center;
            margin-top: 10vh;
            z-index: 5;
        }

        h1 {
            font-family: 'Reem Kufi Calligraphy', sans-serif;
            font-size: 8rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .urdu-subtitle {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 2.2rem;
            margin-bottom: 40px;
            line-height: 2.5;
        }

        /* --- Buttons --- */
        .button-group {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
            z-index: 10;
        }

        .btn {
            padding: 15px 40px;
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 1.8rem;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
        }

        .btn-celebrate {
            background: var(--gold-gradient);
            color: var(--deep-emerald);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            font-weight: bold;
        }

        .btn-dua {
            background: transparent;
            color: var(--gold-gradient);
            border: 2px solid #bf953f;
            color: #fcf6ba;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.8);
        }

        /* --- Dua Display Card --- */
        .blessings-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            min-height: 200px;
        }

        #dua-text {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 1.6rem;
            line-height: 2.2;
            color: #d1fae5;
        }

        /* --- Eid Mubarak Burst Particle Effect --- */
        .eid-particle {
            position: fixed;
            font-family: 'Amiri', serif;
            font-weight: bold;
            color: #fcf6ba;
            pointer-events: none;
            z-index: 99;
            font-size: 2rem;
            text-shadow: 0 0 10px var(--gold-gradient);
            animation: burstOut 2s forwards ease-out;
        }

        @keyframes burstOut {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(1.5); opacity: 0; }
        }

        footer { margin-top: 50px; opacity: 0.4; font-size: 1.1rem; }

        @media (max-width: 768px) {
            h1 { font-size: 4.5rem; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="moon">🌙</div>

    <header>
        <h1>عید مبارک</h1>
        <p class="urdu-subtitle">خوشیوں اور برکتوں کا پیغام</p>
    </header>

    <div class="button-group">
        <button class="btn btn-celebrate" onclick="eidBlast()">عید کی خوشیاں منائیں</button>
        <button class="btn btn-dua" onclick="changeDua()">دعا حاصل کریں</button>
    </div>

    <div class="blessings-card">
        <p id="dua-text">اللہ تعالیٰ آپ کی تمام دعائیں اور عبادتیں قبول فرمائے۔ عید مبارک!</p>
    </div>

    <footer>
        <p>١٤٤٧ ھ | ڈیزائن برائے آپ</p>
    </footer>

    <script>
        // List of Duas
        const duas = [
            "اللہ تعالیٰ آپ کی زندگی کو خوشیوں اور برکتوں سے منور فرمائے۔",
            "اللہ آپ کی تمام دعاؤں کو اپنی بارگاہ میں قبول فرمائے۔",
            "دعا ہے کہ یہ عید آپ کے لیے امن اور سلامتی کا پیغام لائے۔",
            "اللہ آپ کے رزق میں وسعت اور کاروبار میں برکت عطا فرمائے۔",
            "اللہ آپ کو اور آپ کے اہل خانہ کو ہمیشہ اپنی حفظ و امان میں رکھے۔"
        ];

        function changeDua() {
            const textEl = document.getElementById('dua-text');
            const randomDua = duas[Math.floor(Math.random() * duas.length)];
            textEl.style.opacity = 0;
            setTimeout(() => {
                textEl.innerText = randomDua;
                textEl.style.opacity = 1;
            }, 300);
        }

        // Eid Mubarak Burst Effect
        function eidBlast() {
            const count = 15; // Number of "Eid Mubarak" texts to pop out
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'eid-particle';
                p.innerText = 'عید مبارک';
                
                // Random directions for the burst
                const x = (Math.random() - 0.5) * 600 + 'px';
                const y = (Math.random() - 0.5) * 600 + 'px';
                
                p.style.setProperty('--x', x);
                p.style.setProperty('--y', y);
                
                // Set initial position to center screen
                p.style.left = '50%';
                p.style.top = '40%';

                document.body.appendChild(p);

                // Remove the element after animation ends
                setTimeout(() => p.remove(), 2000);
            }
        }
    </script>
</body>
</html>
